name: style-guard
on:
  pull_request:
  push:
    branches: [main]
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - id: files
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          [ -z "$BASE" ] && BASE="${{ github.event.before }}"
          [ -z "$BASE" ] && BASE=$(git rev-parse HEAD~1)
          echo "list=$(git diff --name-only --diff-filter=ACMR "$BASE"...HEAD | grep -E '\.(astro|css|scss|sass)$' | tr '\n' ' ' || true)" >> "$GITHUB_OUTPUT"
      - run: node scripts/style-guard.mjs ${{ steps.files.outputs.list }}
